name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} — lint + WPCS + PHPStan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, cs2pr
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP syntax
        run: |
          find __init__.php src/ -name '*.php' -print0 | \
            xargs -0 -n1 -P4 php -l > /tmp/lint.log 2>&1 || (cat /tmp/lint.log; exit 1)

      - name: PHPCS (WordPress + PHPCompatibilityWP)
        run: composer run lint -- --report=checkstyle | cs2pr
        continue-on-error: true # Phase A: report-only; Phase B+ will tighten

      - name: PHPStan
        run: composer run stan
        continue-on-error: true # Phase A: report-only; Phase B+ will tighten
